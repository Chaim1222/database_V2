name: אימות תבניות
# ידני: המסלול הראשוני (כל ערכי המכלול המיובאים שטרם נבדקו). מתאושש מהמקום שנפסק. דורש את מיגרציה 0012.
on:
  workflow_dispatch:

concurrency:
  group: v2-db-write
  cancel-in-progress: false

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli templates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
