name: "העברת החלטות מהמערכת הישנה"
# ידני. קורא את v1 (קריאה בלבד) וכותב ל-v2 דרך api.import_human_data (אידמפוטנטי). דורש מיגרציה 0017, שהטעינה הראשונית הסתיימה,
# ו-secrets: V1_SUPABASE_URL, V1_SUPABASE_SERVICE_KEY, V2_ADMIN_UID (מזהה חשבון המנהל ב-Authentication של v2).
# dry_run (ברירת מחדל): רק ספירות מ-v1, בלי כתיבה.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "בלי כתיבה (רק ספירות)"
        type: boolean
        default: true

concurrency:
  group: ${{ inputs.dry_run && format('v2-import-check-{0}', github.run_id) || 'v2-db-write' }}   # כתיבה באותו תור; בדיקה ללא כתיבה אינה ממתינה
  cancel-in-progress: false
  queue: max

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.import_v1 ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          V1_SUPABASE_URL: ${{ secrets.V1_SUPABASE_URL }}
          V1_SUPABASE_SERVICE_KEY: ${{ secrets.V1_SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          V2_ADMIN_UID: ${{ secrets.V2_ADMIN_UID }}
