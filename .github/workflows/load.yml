name: "טעינה ראשונה (פעם אחת)"
# הרצה ידנית בלבד. כותבת למסד הפעיל, ולכן נדרשת הקלדת "load" בשדה האישור.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'להקליד load כדי לאשר כתיבה למסד'
        required: true
      dump_date:
        description: 'תאריך דמפ ויקיפדיה (YYYYMMDD) לקיבוע בהפעלה חוזרת; ריק = האחרון שהסתיים'
        required: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

jobs:
  load:
    if: ${{ inputs.confirm == 'load' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"   # כדי שהלוג יתקדם בזמן אמת
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli load
        env:
          DUMP_DATE: ${{ inputs.dump_date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
