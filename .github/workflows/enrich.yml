name: "3. השלמת פרטים לערכים החסרים"
# מתוזמן (פעיל רק כש-ENABLE_SCHEDULE=true) וגם ידני. מריץ את כל קבוצות ההעשרה (redirect, length, desc, created) על דפי ויקיפדיה "חסרים" שטרם נבדקו או התיישנו.
# דורש את מיגרציה 0015. אחרי יציבות: schedule לילי.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_call:
  workflow_dispatch:
    inputs:
      groups:
        description: 'קבוצות מופרדות ברווח (ריק = הכול)'
        required: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli enrich $GROUPS
        env:
          GROUPS: ${{ inputs.groups }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
