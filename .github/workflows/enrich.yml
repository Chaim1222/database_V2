name: "ידני: השלמת פרטים לחסרים"
# ידני ומתוך chain.yml. בשגרה ההעשרה רצה בתוך sync.yml. מריץ את כל קבוצות ההעשרה (redirect, length, desc, created) על דפי ויקיפדיה "חסרים" שטרם נבדקו או התיישנו.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      groups:
        description: 'קבוצות מופרדות ברווח (ריק = הכול)'
        required: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  enrich:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli enrich $ENRICH_GROUPS
        env:
          ENRICH_GROUPS: ${{ inputs.groups }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        uses: ./.github/actions/alert
        with:
          status: ${{ job.status }}

