name: "בדיקות קוד (בכל שינוי)"
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Postgres 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql postgresql-contrib
          sudo systemctl start postgresql
      - name: מיגרציות ובדיקות SQL
        run: |
          sudo -u postgres createuser --superuser "$USER" || true
          PGUSER="$USER" PGHOST=/var/run/postgresql db/run_tests.sh
      - name: db/schema.sql מעודכן (נוצר מהמיגרציות)
        run: |
          PGUSER="$USER" PGHOST=/var/run/postgresql db/gen_schema.sh
          # בלי שורות ריקות: גרסאות pg_dump שונות ב-runners נבדלות רק בהן (נצפה 14.11, PR 56: נכשל ועבר בהרצה חוזרת בלי שינוי)
          diff -B <(git show HEAD:db/schema.sql) db/schema.sql
