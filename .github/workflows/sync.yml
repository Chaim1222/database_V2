name: סנכרון דלתא
# ידני בלבד כרגע. תזמון יתווסף רק אחרי שהטעינה הראשונית והסנכרון הידני הראשון נבדקו.
on:
  workflow_dispatch:

concurrency:
  group: v2-db-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"   # כדי שהלוג יתקדם בזמן אמת
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
