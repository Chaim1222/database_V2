name: "1. עדכון שינויים מהאתרים"
# הריצה המרכזית, פעמיים ביום: סנכרון, העשרת החסרים, בדיקת בריאות, ואחריהם סריקת התוכן. בסוף: התראה על כשל (באותה ריצה).
# תזמון: אחד משלושה בלבד (sync פעמיים ביום, reconcile שבועי עם הגיבוי, revcheck חודשי). פעיל רק כש-ENABLE_SCHEDULE=true.
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "איסוף ושאילתת מצב בלבד, בלי כתיבה (נרשם כריצה מבוטלת)"
        type: boolean
        default: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      synced: ${{ steps.sync.outcome }}   # הסריקה תלויה בסנכרון, לא בהעשרה
    env:
      PYTHONUNBUFFERED: "1"   # כדי שהלוג יתקדם בזמן אמת
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: sync
        run: python -m collector.cli sync $FLAGS
        env:
          FLAGS: ${{ inputs.dry_run && '--dry-run' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: העשרת החסרים
        if: ${{ steps.sync.outcome == 'success' && !inputs.dry_run }}
        run: python -m collector.cli enrich
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: בדיקת בריאות
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: python -m collector.cli health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  content_scan:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.synced == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Reuse the maintained engine and lists; do not fork a second copy in V2.
      - uses: actions/checkout@v5
        with:
          repository: Chaim1222/database
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: בדיקות המנוע
        run: node --test word-filter/tests/*.test.js
      - name: סריקת החסרים (v2)
        run: node word-filter/tools/scan-missing.js --backend v2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  alert:
    needs: [sync, content_scan]
    if: ${{ always() && needs.sync.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/alert
        with:
          status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
