name: "1. עדכון שינויים מהאתרים"
# מתוזמן כל 12 שעות, פעיל רק כש-ENABLE_SCHEDULE=true, וגם ידני. סף ההתראה: 15 שעות ללא הצלחה (0034).
on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "איסוף ושאילתת מצב בלבד, בלי כתיבה (נרשם כריצה מבוטלת)"
        type: boolean
        default: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"   # כדי שהלוג יתקדם בזמן אמת
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli sync $FLAGS
        env:
          FLAGS: ${{ inputs.dry_run && '--dry-run' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
