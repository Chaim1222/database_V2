name: "5. השוואה מלאה מול האתרים"
# צילום מקור מול המראה בחלון סגור; דוח וממצאים. במצב fix מתקנים רק סיווג בשער הקיים ובודקים מחדש; פער לא מוסבר שנותר מכשיל. ההפעלה הידנית נשארת ללא תיקון כברירת מחדל.
# שבועי וגם ידני. צילום המכלול (עם קטגוריות) כ-40 דקות. אחריו הניקוי והחישוב מחדש (לשעבר maintenance.yml), גם כשנמצא פער.
on:
  schedule:
    - cron: "13 3 * * 0"
  workflow_call:
    inputs:
      fix:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_mechalol:
        description: "רק ויקיפדיה"
        type: boolean
        default: false
      fix:
        description: "לתקן סיווג של ערכי מכלול שהמקור אומר עליהם משהו אחר (רק סיווג, בשער 2%)"
        type: boolean
        default: false

concurrency:
  group: v2-db-write
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli reconcile $FLAGS
        env:
          FLAGS: ${{ inputs.skip_mechalol && '--skip-mechalol' || '' }} ${{ (inputs.fix || github.event_name == 'schedule') && '--fix' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: ניקיון וחישוב מחדש
        if: ${{ !cancelled() }}
        run: python -m collector.cli maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        uses: ./.github/actions/alert
        with:
          status: ${{ job.status }}
