name: "התראה כשמשהו נכשל"
# כשאחד מה-workflows של הנתונים נכשל, נפתח Issue (או מתווספת תגובה ל-Issue פתוח קיים של אותו workflow), ו-GitHub שולח מייל.
# כשהריצה הבאה של אותו workflow מצליחה, ה-Issue נסגר אוטומטית. אין צורך ב-secrets.
on:
  workflow_run:
    workflows:
      - "1. עדכון שינויים מהאתרים"
      - "2. בדיקת תבניות מיון"
      - "3. השלמת פרטים לערכים החסרים"
      - "4. בדיקת גרסאות (פעם בחודש)"
      - "5. השוואה מלאה מול האתרים"
      - "2 עד 5: הכול ברצף"
      - "ניקיון וחישוב מחדש"
      - "בדיקה שהכול מתעדכן"
      - "גיבוי החלטות אדם (שבועי)"
      - "טעינה ראשונה (פעם אחת)"
      - "בדיקת עשן מול האתרים"
      - "הוספת שינויי מסד"
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `נכשל: ${run.name}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", labels: "alert", per_page: 100,
            });
            const existing = open.find(i => i.title === title);
            if (run.conclusion === "success") {
              if (existing) {
                await github.rest.issues.createComment({...context.repo, issue_number: existing.number,
                  body: `הריצה הבאה הצליחה: ${run.html_url}. סוגר.`});
                await github.rest.issues.update({...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed"});
              }
              return;
            }
            const body = `הריצה נכשלה: ${run.html_url}\nענף: ${run.head_branch}, אירוע: ${run.event}`;
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, labels: ["alert"]});
            }
