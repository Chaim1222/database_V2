name: "ניקיון וחישוב מחדש"
# מוחק העשרה וסינון של דפים שכבר אינם "חסרים" וישנים מ-90 יום (api.maintenance_prune). פעיל מתוזמן רק כש-ENABLE_SCHEDULE=true.
# דורש מיגרציה 0019.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

concurrency:
  group: v2-db-write
  cancel-in-progress: false
  queue: max

jobs:
  maintenance:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
