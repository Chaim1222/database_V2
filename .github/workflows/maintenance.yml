name: "ידני: ניקיון וחישוב מחדש"
# ידני בלבד (בשגרה אותה פקודה רצה כשלב אחרון ב-reconcile.yml השבועי). collector.cli maintenance:
# רענון מלא של "חסר במכלול" במנות (maintenance_refresh_gap), רענון המספרים השמורים בדשבורד (maintenance_refresh_counts),
# ומחיקת העשרה וסינון של דפים שכבר אינם "חסרים" וישנים מ-90 יום (maintenance_prune).
on:
  workflow_dispatch:

concurrency:
  group: v2-db-write
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli maintenance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - if: always()
        uses: ./.github/actions/alert
        with:
          status: ${{ job.status }}
