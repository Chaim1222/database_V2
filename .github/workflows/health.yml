name: שער בריאות
# קורא רק את מצב הריצות (api.health_check) ונכשל כשהנתונים ישנים או ריצה תקועה, כדי ש-GitHub ישלח מייל.
# ידני כרגע. אחרי שהסנכרון מתוזמן ויציב: להסיר את ההערה מה-cron (בדיקה כל שעה).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "23 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
