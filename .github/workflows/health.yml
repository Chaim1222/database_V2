name: "בדיקה שהכול מתעדכן"
# קורא רק את מצב הריצות (api.health_check) ונכשל כשהנתונים ישנים או ריצה תקועה, כדי ש-GitHub ישלח מייל.
# מתוזמן, אך פעיל רק כשמשתנה הריפו ENABLE_SCHEDULE=true (Settings, Variables).
on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

jobs:
  health:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m collector.cli health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
